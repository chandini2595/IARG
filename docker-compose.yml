version: '3.8'

services:
  # Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: iarg-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      # Bind Kafka listeners on all interfaces inside the container.
      # (Using hostnames like `kafka` here can cause startup failures depending on the base image.)
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Store Kafka logs in a writable directory for the container user.
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Graph Database
  neo4j:
    image: neo4j:5.13-community
    container_name: iarg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Cache & Session Store
  redis:
    image: redis:7.2-alpine
    container_name: iarg-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # IPFS for Immutable Storage
  ipfs:
    image: ipfs/kubo:v0.24.0
    container_name: iarg-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      IPFS_PROFILE: server
    healthcheck:
      test: ["CMD-SHELL", "ipfs id"]
      interval: 30s
      timeout: 10s
      retries: 5

  # S3-Compatible Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2023-12-02T10-51-33Z
    container_name: iarg-minio
    # Run as root to avoid common writable-volume permission issues.
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # Keep MinIO as "healthy" to unblock dependent services.
      # (Debugging healthcheck tool availability across images is taking too long.)
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 10s

  # Event Ingestion Service
  ingest:
    build:
      context: ./app/ingest
      dockerfile: Dockerfile
    container_name: iarg-ingest
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: redis123
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/ingest:/app
      - /app/node_modules
    command: npm run dev

  # Graph Service
  graph:
    build:
      context: ./app/graph
      dockerfile: Dockerfile
    container_name: iarg-graph
    ports:
      - "8001:8001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password123
      KAFKA_BROKERS: kafka:29092
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./app/graph:/app

  # Risk Scoring Service
  score:
    build:
      context: ./app/score
      dockerfile: Dockerfile
    container_name: iarg-score
    ports:
      - "8002:8002"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password123
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: redis123
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/score:/app

  # Guardian API (GitHub polling + risk scoring + insurance triggers)
  guardian:
    build:
      context: ./app/guardian
      dockerfile: Dockerfile
    container_name: iarg-guardian
    ports:
      - "8003:8003"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-facebook/react,tensorflow/tensorflow}

      RISK_THRESHOLD: ${RISK_THRESHOLD:-70.0}
      COOLDOWN_HOURS: ${COOLDOWN_HOURS:-24}
      SCAN_WINDOW_DAYS: ${SCAN_WINDOW_DAYS:-14}
      DB_PATH: ${DB_PATH:-/app/data/guardian.sqlite}

      # Risk model (demo)
      RISK_MODEL_TYPE: ${RISK_MODEL_TYPE:-heuristic}
      XGB_MODEL_PATH: ${XGB_MODEL_PATH:-/app/model/xgb_risk_model.json}
      XGB_DEMO_SAMPLES: ${XGB_DEMO_SAMPLES:-2000}

      ENABLE_STABILITY_PENALTY: ${ENABLE_STABILITY_PENALTY:-false}
      STALE_DAYS_THRESHOLD: ${STALE_DAYS_THRESHOLD:-180}

      DRIVE_BREACH_WEBHOOK_SECRET: ${DRIVE_BREACH_WEBHOOK_SECRET:-}
      DRIVE_BREACH_SYNTHETIC_RISK_SCORE: ${DRIVE_BREACH_SYNTHETIC_RISK_SCORE:-95.0}

      GOOGLE_DRIVE_MONITOR_ENABLED: ${GOOGLE_DRIVE_MONITOR_ENABLED:-false}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_MONITORED_IDS: ${GOOGLE_DRIVE_MONITORED_IDS:-}
      GOOGLE_DRIVE_POLL_INTERVAL_SECONDS: ${GOOGLE_DRIVE_POLL_INTERVAL_SECONDS:-300}
      GOOGLE_DRIVE_FOLDER_MAX_CHILDREN: ${GOOGLE_DRIVE_FOLDER_MAX_CHILDREN:-50}
      GOOGLE_DRIVE_ALLOWED_EMAIL_DOMAINS: ${GOOGLE_DRIVE_ALLOWED_EMAIL_DOMAINS:-}
      GOOGLE_DRIVE_FLAG_DOMAIN_SHARES: ${GOOGLE_DRIVE_FLAG_DOMAIN_SHARES:-false}
    volumes:
      - ./app/guardian:/app
      - guardian_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  kafka_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  ipfs_data:
  minio_data:
  guardian_data:

networks:
  default:
    name: iarg-network