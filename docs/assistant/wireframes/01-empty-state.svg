<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #020617; }
      .sidebar { fill: #0b1220; }
      .page { fill: #030712; }
      .card { fill: #0b1220; stroke: #1e3a8a; stroke-opacity: 0.4; }
      .input { fill: #111827; stroke: #1d4ed8; stroke-opacity: 0.35; }
      .chip { fill: #1e3a8a; fill-opacity: 0.25; stroke: #3b82f6; stroke-opacity: 0.45; }
      .btn-primary { fill: #2563eb; }
      .btn-secondary { fill: #1f2937; stroke: #374151; }
      .nav-active { fill: #1e3a8a; fill-opacity: 0.3; stroke: #3b82f6; stroke-opacity: 0.5; }
      .text-primary { fill: #f3f4f6; }
      .text-muted { fill: #9ca3af; }
      .text-dim { fill: #6b7280; }
      .text-accent { fill: #93c5fd; }
      .divider { stroke: #1e3a8a; stroke-opacity: 0.4; stroke-width: 1; }
      .live { fill: #34d399; }
      text { font-size: 13px; }
      .title { font-size: 20px; font-weight: 600; }
      .h2 { font-size: 15px; font-weight: 600; }
      .caption { font-size: 11px; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>

  <!-- Sidebar -->
  <rect class="sidebar" x="0" y="0" width="240" height="760"/>
  <circle cx="36" cy="42" r="14" fill="#1e3a8a"/>
  <text class="text-primary" x="60" y="40" font-weight="600" font-size="16">IARG</text>
  <text class="text-muted" x="60" y="58" font-size="11">Intangible-Asset Risk Guardian</text>
  <circle cx="24" cy="88" r="4" class="live"/>
  <text class="text-muted" x="36" y="92" font-size="11">Live Monitor</text>

  <!-- Nav items -->
  <g font-size="13">
    <rect x="12" y="120" width="216" height="36" rx="6" fill="transparent"/>
    <text class="text-muted" x="48" y="143">Monitor</text>
    <rect x="12" y="160" width="216" height="36" rx="6" fill="transparent"/>
    <text class="text-muted" x="48" y="183">Assets</text>
    <rect x="12" y="200" width="216" height="36" rx="6" fill="transparent"/>
    <text class="text-muted" x="48" y="223">Risk Scoring</text>
    <rect x="12" y="240" width="216" height="36" rx="6" fill="transparent"/>
    <text class="text-muted" x="48" y="263">Insurance</text>

    <!-- Active -->
    <rect class="nav-active" x="12" y="280" width="216" height="36" rx="6"/>
    <rect x="12" y="280" width="4" height="36" fill="#3b82f6"/>
    <text class="text-accent" x="48" y="303" font-weight="600">Assistant</text>

    <rect x="12" y="320" width="216" height="36" rx="6" fill="transparent"/>
    <text class="text-muted" x="48" y="343">Settings</text>
  </g>

  <!-- Main area -->
  <rect class="page" x="240" y="0" width="1040" height="760"/>

  <!-- Header -->
  <text class="text-primary title" x="280" y="60">Assistant</text>
  <text class="text-muted" x="280" y="86">Free chatbot powered by a public LLM endpoint. No API key required.</text>

  <!-- Model selector + clear -->
  <text class="text-muted caption" x="920" y="60">Model</text>
  <rect class="input" x="960" y="42" width="220" height="30" rx="6"/>
  <text class="text-primary" x="972" y="62">Mistral Nemo Instruct (free)</text>
  <polygon points="1162,56 1172,56 1167,64" fill="#9ca3af"/>
  <rect class="btn-secondary" x="1192" y="42" width="36" height="30" rx="6"/>
  <text x="1206" y="62" fill="#9ca3af" font-size="14">🗑</text>

  <!-- Chat card -->
  <rect class="card" x="280" y="120" width="948" height="580" rx="10"/>

  <!-- Empty state -->
  <circle cx="754" cy="260" r="30" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-opacity="0.5"/>
  <rect x="740" y="248" width="28" height="22" rx="4" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <line x1="754" y1="248" x2="754" y2="240" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="748" cy="258" r="1.6" fill="#93c5fd"/>
  <circle cx="760" cy="258" r="1.6" fill="#93c5fd"/>

  <text class="text-primary" x="754" y="320" text-anchor="middle" font-size="16" font-weight="600">Ask the IARG assistant anything</text>
  <text class="text-muted" x="754" y="344" text-anchor="middle" font-size="13">Try one of the prompts below or type your own question.</text>

  <!-- Suggestion chips -->
  <g font-size="12">
    <rect class="chip" x="454" y="380" width="240" height="28" rx="14"/>
    <text class="text-accent" x="574" y="399" text-anchor="middle">What does the IARG dashboard do?</text>

    <rect class="chip" x="712" y="380" width="256" height="28" rx="14"/>
    <text class="text-accent" x="840" y="399" text-anchor="middle">How is a risk score computed in IARG?</text>

    <rect class="chip" x="398" y="420" width="304" height="28" rx="14"/>
    <text class="text-accent" x="550" y="439" text-anchor="middle">When does IARG trigger insurance automatically?</text>

    <rect class="chip" x="720" y="420" width="276" height="28" rx="14"/>
    <text class="text-accent" x="858" y="439" text-anchor="middle">How can I report a Google Drive breach?</text>
  </g>

  <!-- Input area -->
  <line class="divider" x1="280" y1="620" x2="1228" y2="620"/>
  <rect class="input" x="296" y="636" width="864" height="48" rx="6"/>
  <text class="text-dim" x="310" y="664">Message the assistant…  (Enter to send, Shift+Enter for newline)</text>

  <rect class="btn-primary" x="1172" y="636" width="56" height="48" rx="6"/>
  <polygon points="1192,654 1210,660 1192,666 1194,660" fill="#f3f4f6"/>

  <text class="text-muted caption" x="296" y="700">Responses come from a public free model and may be inaccurate. Avoid sending sensitive data.</text>
</svg>
