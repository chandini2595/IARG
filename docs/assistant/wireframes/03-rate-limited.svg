<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #020617; }
      .sidebar { fill: #0b1220; }
      .page { fill: #030712; }
      .card { fill: #0b1220; stroke: #1e3a8a; stroke-opacity: 0.4; }
      .input { fill: #111827; stroke: #1d4ed8; stroke-opacity: 0.35; }
      .user-bubble { fill: #10b981; fill-opacity: 0.12; stroke: #10b981; stroke-opacity: 0.4; }
      .bot-bubble { fill: #111827; stroke: #1d4ed8; stroke-opacity: 0.4; }
      .err-bubble { fill: #7f1d1d; fill-opacity: 0.2; stroke: #ef4444; stroke-opacity: 0.5; }
      .btn-secondary { fill: #1f2937; stroke: #374151; }
      .btn-stop { fill: #1f2937; stroke: #ef4444; stroke-opacity: 0.5; }
      .nav-active { fill: #1e3a8a; fill-opacity: 0.3; stroke: #3b82f6; stroke-opacity: 0.5; }
      .toast { fill: #363636; }
      .text-primary { fill: #f3f4f6; }
      .text-muted { fill: #9ca3af; }
      .text-dim { fill: #6b7280; }
      .text-accent { fill: #93c5fd; }
      .text-user { fill: #d1fae5; }
      .text-err { fill: #fecaca; }
      .divider { stroke: #1e3a8a; stroke-opacity: 0.4; stroke-width: 1; }
      .live { fill: #34d399; }
      text { font-size: 13px; }
      .title { font-size: 20px; font-weight: 600; }
      .caption { font-size: 11px; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>

  <!-- Sidebar -->
  <rect class="sidebar" x="0" y="0" width="240" height="760"/>
  <circle cx="36" cy="42" r="14" fill="#1e3a8a"/>
  <text class="text-primary" x="60" y="40" font-weight="600" font-size="16">IARG</text>
  <text class="text-muted" x="60" y="58" font-size="11">Intangible-Asset Risk Guardian</text>
  <circle cx="24" cy="88" r="4" class="live"/>
  <text class="text-muted" x="36" y="92" font-size="11">Live Monitor</text>
  <g font-size="13">
    <text class="text-muted" x="48" y="143">Monitor</text>
    <text class="text-muted" x="48" y="183">Assets</text>
    <text class="text-muted" x="48" y="223">Risk Scoring</text>
    <text class="text-muted" x="48" y="263">Insurance</text>
    <rect class="nav-active" x="12" y="280" width="216" height="36" rx="6"/>
    <rect x="12" y="280" width="4" height="36" fill="#3b82f6"/>
    <text class="text-accent" x="48" y="303" font-weight="600">Assistant</text>
    <text class="text-muted" x="48" y="343">Settings</text>
  </g>

  <!-- Main area -->
  <rect class="page" x="240" y="0" width="1040" height="760"/>
  <text class="text-primary title" x="280" y="60">Assistant</text>
  <text class="text-muted" x="280" y="86">Free chatbot powered by a public LLM endpoint. No API key required.</text>

  <text class="text-muted caption" x="920" y="60">Model</text>
  <rect class="input" x="960" y="42" width="220" height="30" rx="6"/>
  <text class="text-primary" x="972" y="62">GPT-OSS 20B (free)</text>
  <polygon points="1162,56 1172,56 1167,64" fill="#9ca3af"/>
  <rect class="btn-secondary" x="1192" y="42" width="36" height="30" rx="6"/>
  <text x="1206" y="62" fill="#9ca3af" font-size="14">🗑</text>

  <!-- Toast (top-right) -->
  <rect class="toast" x="940" y="100" width="310" height="48" rx="6"/>
  <circle cx="958" cy="124" r="6" fill="#ef4444"/>
  <text class="text-primary" x="976" y="121">Chat failed</text>
  <text class="text-muted caption" x="976" y="138">Model is rate-limited. Retry in 2s.</text>

  <!-- Chat card -->
  <rect class="card" x="280" y="170" width="948" height="530" rx="10"/>

  <!-- Prior user bubble -->
  <rect class="user-bubble" x="820" y="200" width="360" height="40" rx="8"/>
  <text class="text-user" x="836" y="224">Explain the risk scoring breakdown.</text>
  <circle cx="1200" cy="220" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="1200" y="224" text-anchor="middle" fill="#10b981" font-size="12">👤</text>

  <!-- Bot error bubble -->
  <circle cx="316" cy="276" r="14" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="316" y="280" text-anchor="middle" fill="#93c5fd" font-size="12">🤖</text>
  <rect class="err-bubble" x="344" y="256" width="520" height="48" rx="8"/>
  <text class="text-err" x="364" y="284" font-style="italic">Error contacting model</text>
  <text class="text-err" x="490" y="284">: Model is rate-limited. Retry in 2s.</text>

  <!-- Second user try, now in-flight -->
  <rect class="user-bubble" x="820" y="330" width="360" height="40" rx="8"/>
  <text class="text-user" x="836" y="354">Try again now.</text>
  <circle cx="1200" cy="350" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="1200" y="354" text-anchor="middle" fill="#10b981" font-size="12">👤</text>

  <!-- Typing bubble -->
  <circle cx="316" cy="406" r="14" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="316" y="410" text-anchor="middle" fill="#93c5fd" font-size="12">🤖</text>
  <rect class="bot-bubble" x="344" y="388" width="88" height="36" rx="8"/>
  <circle cx="362" cy="406" r="3" fill="#93c5fd" opacity="0.9"/>
  <circle cx="378" cy="406" r="3" fill="#93c5fd" opacity="0.7"/>
  <circle cx="394" cy="406" r="3" fill="#93c5fd" opacity="0.4"/>

  <!-- Input area (with Stop button since loading) -->
  <line class="divider" x1="280" y1="620" x2="1228" y2="620"/>
  <rect class="input" x="296" y="636" width="864" height="48" rx="6"/>
  <text class="text-dim" x="310" y="664">(input disabled while generating…)</text>

  <rect class="btn-stop" x="1172" y="636" width="56" height="48" rx="6"/>
  <text x="1200" y="665" text-anchor="middle" fill="#fecaca" font-size="13">Stop</text>

  <text class="text-muted caption" x="296" y="700">Responses come from a public free model and may be inaccurate. Avoid sending sensitive data.</text>
</svg>
